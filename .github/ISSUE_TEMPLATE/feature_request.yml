name: "💡 Feature request / Wunsch"
description: "Idea for a new feature or improvement. / Idee für eine neue Funktion oder Verbesserung."
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! English or German – both are welcome.
        Danke für deine Idee! Englisch oder Deutsch – beides ist willkommen.
  - type: dropdown
    id: area
    attributes:
      label: "Area / Bereich"
      options:
        - "Live spots & filters / Live-Spots & Filter"
        - "Activity Hunting Tool (POTA, SOTA …)"
        - "HF-WX (solar & propagation / Sonne & Ausbreitung)"
        - "Statistics / Statistik"
        - "DXpeditions / DXpeditionen"
        - "Push notifications / Push-Benachrichtigungen"
        - "Phone app (PWA) / App auf dem Handy (PWA)"
        - "Telnet / cluster node (DM3KS-9)"
        - "New page / Neue Seite"
        - "Other / Anderes"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What do you want to achieve? / Was möchtest du erreichen?"
      description: "Describe the situation, not only the solution. / Beschreibe die Situation, nicht nur die Lösung."
      placeholder: "e.g. As a POTA hunter I'd like to … / z.B. Als POTA-Hunter möchte ich …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "How could it work? / Wie könnte es aussehen?"
      placeholder: "A button …, a filter …, a column … / Ein Knopf …, ein Filter …, eine Spalte …"
  - type: textarea
    id: example
    attributes:
      label: "Example elsewhere / Vorbild oder Beispiel"
      description: "Seen this elsewhere (e.g. pota.app, DXHeat, HamAlert)? A link or screenshot helps. / Gibt es das schon woanders ? Link oder Screenshot hilft."
  - type: dropdown
    id: importance
    attributes:
      label: "How important is it to you? / Wie wichtig ist dir das?"
      options:
        - "Nice to have / Nett zu haben"
        - "I'd use it often / Würde ich oft nutzen"
        - "I really miss it / Fehlt mir wirklich"
  - type: checkboxes
    id: checks
    attributes:
      label: "Quick check / Kurz geprüft"
      options:
        - label: "I searched the existing issues. / Ich habe die vorhandenen Issues durchsucht."
          required: true
