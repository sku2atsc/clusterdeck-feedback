name: "📡 Spot & data problem / Spots & Daten"
description: "Wrong or missing spots, references, countries, solar data. / Falsche oder fehlende Spots, Referenzen, Länder, Sonnendaten."
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        For problems with the content, not the interface – e.g. a POTA spot with a missing or wrong reference, a wrong country, a missing SOTA spot.
        Für Probleme mit den Inhalten, nicht mit der Bedienung – z.B. ein POTA-Spot ohne oder mit falscher Referenz, ein falsches Land, ein fehlender SOTA-Spot.
  - type: dropdown
    id: kind
    attributes:
      label: "Kind of problem / Art des Problems"
      options:
        - "POTA/SOTA spot missing / POTA-/SOTA-Spot fehlt"
        - "Reference missing or wrong / Referenz fehlt oder falsch"
        - "Duplicate spot / Spot doppelt"
        - "Wrong country/continent / Land/Kontinent falsch"
        - "Activator wrongly shown active or QRT / Aktivierer fälschlich aktiv oder QRT"
        - "DXpedition missing or wrong / DXpedition fehlt oder falsch"
        - "Solar or propagation data / Sonnen-/Ausbreitungsdaten"
        - "Other / Anderes"
    validations:
      required: true
  - type: input
    id: call
    attributes:
      label: "Callsign (DX/activator) / Rufzeichen (DX/Aktivierer)"
      placeholder: "e.g. K1ABC"
    validations:
      required: true
  - type: input
    id: spot
    attributes:
      label: "Frequency, time (UTC), reference / Frequenz, Zeit (UTC), Referenz"
      placeholder: "14062.0 kHz · 2026-10-19 07:45 UTC · US-1234"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "What's wrong? / Was stimmt nicht?"
      description: "What was shown, what would be correct? / Was wurde angezeigt, was wäre richtig?"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
